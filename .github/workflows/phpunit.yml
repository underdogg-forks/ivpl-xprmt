name: PHPUnit

# PHP version policy:
#   - Every push to prep/v180 and every pull request runs the suite on the
#     PHP 8.2 floor (composer.json requires ^8.2), so day-to-day CI stays fast.
#   - The weekly schedule and manual runs sweep every supported version
#     (8.2, 8.3, 8.4) so upper-version regressions are still caught, without
#     paying for a full matrix on every push.
#
# Database: the suite runs against MariaDB 10.11 and MySQL 8.0, each at the
# server's own default sql_mode, so it exercises the same SQL (NOW(), IF(),
# DATEDIFF(), ...) the application uses in production. MySQL 8's default mode
# adds ONLY_FULL_GROUP_BY, which MariaDB's leaves off: a grouped query MariaDB
# accepts can be a blank HTTP 500 there (InvoicePlane/InvoicePlane#1865). The
# schema is built through Mdl_Setup (tests/Support/build-test-db.php) and the
# baseline rows are seeded via tests/Support/seed-test-db.php.
#
# The MySQL job reports without failing the run until it has been green once;
# drop its `experimental: true` then.

on:
  # Not every push to every branch — only the shared integration branch and
  # pull requests. Feature-branch work is covered when it opens/updates a PR.
  push:
    branches:
      - prep/v180
  pull_request:
  #schedule:
  #  - cron: '0 6 * * 1'   # Mondays 06:00 UTC — full version sweep
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP version to test (or "all" for 8.2, 8.3 and 8.4)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - '8.2'
          - '8.3'
          - '8.4'
      fail_fast:
        description: 'Stop on first failure'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  # Resolve which PHP versions this run should cover.
  matrix:
    name: Resolve PHP versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      - id: resolve
        run: |
          case "${{ github.event_name }}" in
            schedule)
              versions='["8.2","8.3","8.4"]' ;;
            workflow_dispatch)
              if [ "${{ github.event.inputs.php_version }}" = "all" ]; then
                versions='["8.2","8.3","8.4"]'
              else
                versions='["${{ github.event.inputs.php_version }}"]'
              fi ;;
            *)
              versions='["8.2"]' ;;
          esac
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  test:
    name: PHPUnit (PHP ${{ matrix.php }}, ${{ matrix.database.image }})
    needs: matrix
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.database.experimental }}

    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: invoiceplane_test
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: invoiceplane_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.database.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.matrix.outputs.versions) }}
        database:
          - image: mariadb:10.11
            health: healthcheck.sh --connect --innodb_initialized
            experimental: false
            known_installer_errors: ''
          # 043_1.7.2.sql compares a DATE column with '0000-00-00', which MySQL 8's strict mode rejects,
          # so the setup wizard reports this error on a MySQL 8 install (044_1.7.3.sql redoes the cleanup).
          - image: mysql:8.0
            health: mysqladmin ping -h 127.0.0.1 -uroot -proot --silent
            experimental: true
            known_installer_errors: "Incorrect DATE value: '0000-00-00'"

    env:
      DB_HOSTNAME: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: invoiceplane_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP with Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring,xml,ctype,json,fileinfo,curl,pdo,mysql,bcmath
          tools: composer:latest
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      # The e-invoicing generation tests validate the produced Factur-X / UBL
      # against EN 16931 Schematron, which EInvoiceSchematronValidator runs
      # through Saxon (a JAR). Without a JDK those tests skip themselves; a JDK
      # here lets them run for real.
      - name: Set up JDK (Saxon / Schematron)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the schema and seed baseline
        run: |
          export MYSQL_PWD="$DB_PASSWORD"
          # Leave sql_mode at the server's default, as a user's server has it:
          # emptying it hid every query and insert the default mode rejects.
          # Build the schema the way an installation gets it: Mdl_Setup runs the SQL files and the
          # PHP upgrade steps, so a change to either is exercised by every test.
          TEST_DB_KNOWN_INSTALLER_ERRORS="${{ matrix.database.known_installer_errors }}" php tests/Support/build-test-db.php
          php tests/Support/seed-test-db.php

      - name: Prepare test configuration (MySQL)
        run: |
          cp ipconfig.php.example ipconfig.php
          sed -i \
            -e "s|^DB_HOSTNAME=.*|DB_HOSTNAME=${DB_HOSTNAME}|" \
            -e "s|^DB_PORT=.*|DB_PORT=${DB_PORT}|" \
            -e "s|^DB_DATABASE=.*|DB_DATABASE=${DB_DATABASE}|" \
            -e "s|^DB_USERNAME=.*|DB_USERNAME=${DB_USERNAME}|" \
            -e "s|^DB_PASSWORD=.*|DB_PASSWORD=${DB_PASSWORD}|" \
            -e 's|^SETUP_COMPLETED=.*|SETUP_COMPLETED=true|' \
            -e 's|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=0123456789abcdef0123456789abcdef|' \
            ipconfig.php
          echo 'DB_DRIVER=mysqli' >> ipconfig.php
          # The test runner posts form data directly; it does not carry a CSRF
          # token, so disable CSRF for the functional suite (the dedicated CSRF
          # tests assert protection statically, not via live POSTs).
          echo 'CSRF_PROTECTION=false' >> ipconfig.php

      - name: Config-parity guard (release gate)
        run: php .claude/skills/config-parity-guard/audit.php

      - name: Run PHPUnit
        # DB_* MUST be unset here. They are set at job level for the schema-build
        # steps above, but if they survive into this step PHP's Dotenv sees them
        # as "already set" and never copies the ipconfig.php values into $_ENV;
        # env() then returns null, the parent connects as ''@'localhost', and
        # every DB-backed test markTestSkipped()s — a green build hiding ~180
        # tests that never ran. Unset them so ipconfig.php is the source of truth.
        #
        # phpunit.xml excludes the `slow` and `flaky` groups from this default
        # run; the next step runs them so CI coverage stays complete.
        run: |
          env -u DB_HOSTNAME -u DB_PORT -u DB_DATABASE -u DB_USERNAME -u DB_PASSWORD \
            vendor/bin/phpunit ${{ github.event.inputs.fail_fast == 'true' && '--stop-on-failure' || '' }}

      - name: Run PHPUnit (slow / flaky groups)
        # A CLI --group overrides phpunit.xml's <groups> exclusion, so this runs
        # exactly the tests the default pass skipped. Nothing is permanently
        # masked. No-op (exit 0) while nothing is tagged.
        run: |
          env -u DB_HOSTNAME -u DB_PORT -u DB_DATABASE -u DB_USERNAME -u DB_PASSWORD \
            vendor/bin/phpunit --group slow,flaky ${{ github.event.inputs.fail_fast == 'true' && '--stop-on-failure' || '' }}
