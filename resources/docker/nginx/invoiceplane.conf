server {

    listen 80;

    server_name ivpl.local;
    # Serve from the public/ web root — only public/index.php is exposed; the
    # application, bootstrap, vendor, storage and uploads trees stay above it.
    root /var/www/projects/invoiceplane/public;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
        proxy_cookie_path / "/; HTTPOnly; Secure; SameSite=Lax";
    }

    # Application code, dependencies and private data are never served or executed directly.
    # nginx does not honour the .htaccess files that protect these paths on Apache: without these
    # rules archived invoice PDFs (uploads/archive, predictable file names), customer attachments,
    # import CSVs and vendor/ scripts were all reachable without logging in. Case-insensitive and
    # trailing-dot/space tolerant, same as the htaccess template and web.config (GHSA-83qx-qhxp-crhc).
    location ~* ^/+(application|vendor|storage|resources|node_modules|tests|\.github|uploads/+(archive|customer_files|import|temp))[.\x20]*(/|$) {
        return 404;
    }

    # Dotfiles (.git, .env, .htaccess ...) except ACME challenges
    location ~* (^|/)\.(?!well-known(/|$)) {
        return 404;
    }

    location ~* ^/+(composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|[^/]+\.md|phpcs\.xml|phpunit\.xml|phpstan[^/]*|pint\.json|rector\.php|Gruntfile\.js|(docker-)?compose\.yml|crowdin\.yml|Dockerfile|Makefile|playwright\.config\.js|htaccess|web\.config|ipconfig\.php[^/]*|LICENSE\.txt)[.\x20]*$ {
        return 404;
    }

    # index.php is the only PHP entry point; every other .php file is refused. Placed above the
    # static/alias blocks below so a crafted .php name under uploads/ or assets/ cannot reach them.
    location ~* ^/+(?!index\.php(/|$)).*\.php(/|$) {
        return 404;
    }

    # public/ holds index.php, favicon.ico, robots.txt and assets/ (generated by "yarn build" from
    # resources/assets), so none of them needs mapping. The only thing the pages link to outside it
    # are the logo files directly inside uploads/, mapped in explicitly; the uploads subdirectories
    # stay denied above. No "^~" here: that modifier would skip the regex locations above (including
    # the php refusal), letting a crafted .php name under assets/ slip through as a static file.
    location /assets/ {
        access_log off;
        expires 7d;
    }

    location ~ ^/uploads/([^/]+\.(?:png|jpe?g|gif|svg|webp))$ {
        alias /var/www/projects/invoiceplane/uploads/$1;
    }

    # The one PHP file nginx actually executes; everything else matching \.php$ was already
    # refused above, so in practice this only ever receives /index.php.
    location ~ \.php$ {
        try_files $uri /index.php =404;
        fastcgi_pass php-upstream;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        #fixes timeouts
        fastcgi_read_timeout 600;
        include fastcgi_params;
    }

    # storage/ holds session data, logs, cache, and temporary SUMEX invoice XML
    # (patient PII); nginx does not honor .htaccess, so deny it explicitly here.
    location ^~ /storage/ {
        deny all;
        return 404;
    }

    # uploads/ subdirectories contain sensitive financial data (import CSVs, archived invoices);
    # nginx does not honor .htaccess, so deny them explicitly here.
    location ^~ /uploads/customer_files/ {
        deny all;
        return 404;
    }

    location ^~ /uploads/archive/ {
        deny all;
        return 404;
    }

    location ^~ /uploads/import/ {
        deny all;
        return 404;
    }

    location ^~ /uploads/temp/ {
        deny all;
        return 404;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt/;
        log_not_found off;
    }

    error_log /var/log/nginx/ivpl_error.log;
    access_log /var/log/nginx/ivpl_access.log;
}
